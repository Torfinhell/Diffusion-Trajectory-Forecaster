_target_: src.models.DiffVBD
extract_map: ${dataset.data.train.creation_cfg.preprocessing.extract_map}
extract_traffic: ${dataset.data.train.creation_cfg.preprocessing.extract_traffic}
extract_relations: ${dataset.data.train.creation_cfg.preprocessing.extract_relations}
se_args:
  encoder: full
  rnn_type: "mhsa" # one of "lstm" "mhsa"
  rnn_num_heads: 1
  sa_num_heads: 1
  drop_attn: 0.1
  mlp_dim: 60
  num_mlp_layers: 2
  num_agents: ${trainer.num_agents}
  time_len: 2
  num_feat: 2
  out_dim: 128          # context/model dim (VBD uses 256; 128 to fit memory)
  pos_emb_type: "lookup"
  rope_theta: 0.1
  combiner_type: "context_combiner"
# --- VBD denoiser ---
dim: 128                # must equal se_args.out_dim
heads: 4                # VBD uses 8; 4 keeps head_dim=32
num_self_layers: 6      # VBD encoder_layers
num_cross_layers: 4     # VBD decoder cross-attention depth
num_actions: 16         # out_shape[1]; future_len / action_len (64 / 4)
action_len: ${losses.action_len}
num_diffusion_steps: 50
dt: 0.1
cross_agent_causal: false   # true => joint cross-agent causal decoder (full VBD)
cross_residual: true        # add query residual in cross-attn
