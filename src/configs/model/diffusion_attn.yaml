_target_: src.models.DiffAttention
extract_map: ${dataset.data.train.creation_cfg.preprocessing.extract_map}
extract_traffic: ${dataset.data.train.creation_cfg.preprocessing.extract_traffic}
extract_relations: ${dataset.data.train.creation_cfg.preprocessing.extract_relations}
se_args:
  encoder: full
  rnn_type: "mhsa" # one of "lstm" "mhsa"
  rnn_num_heads: 1
  sa_num_heads: 1
  drop_attn: 0.1
  mlp_dim: 60
  num_mlp_layers: 2
  num_agents: ${trainer.num_agents}
  time_len: 2
  num_feat: 2
  out_dim: 40
  pos_emb_type: "lookup" #one of "rope", "lookup", "None"
  rope_theta: 0.1
  combiner_type: "transformer" #or "context_combiner"
samlp_args:
  attn_dim: 160
  attn_num_heads: 4
  mlp_dim: 256
  num_mlp_layers: 2
  drop_attn: 0.0
  out_dim: 160
num_sa_mlp: 2
camlp_args:
  attn_dim: 160
  attn_num_heads: 4
  mlp_dim: 256
  num_mlp_layers: 2
  drop_attn: 0.0
  out_dim: 160
  kv_dim: 40
num_camlp: 4
out_shape: [32, 80, 2]
final_out_dim: 32
