defaults:
  - model: diffusion_attn_overfit
  - dataloaders: overfit
  - feat_extract: small_no_scenes
  - transforms: null
  - logger: clearml
  - metrics: all_metrics
  - visual: default
  - diffusion_sampler: ddpm
  - _self_

trainer:
  num_epochs: 500
  train_epoch_len: 1        # 1 batch per epoch → overfit on same sample
  val_epoch_len: 1
  gradient_clip_val: 5
  log_every_n_steps: 1
  seed: 1
  inner_steps: 10
  train_metric_batches: 1
  val_metric_batches: 1
  train_metric_every_n_epochs: 1
  val_metric_every_n_epochs: 1
  check_val_every_n_epoch: 5
  samples_per_scene: 1
  generate_every_epoch: 0
  print_hparams: False
  logging: "offline"
  load_best_checkpoint: False

  enable_profiler: False
  enable_jax_profiler: False
  jax_profiler_dir: null
  jax_profiler_start_step: 2
  jax_profiler_num_steps: 3
  proxy_val_loss:
    enabled: false
    step_stride: 5
    include_last: true

visual:
  enable_visualization: false

prediction_target: x0
t0: 1e-3
t1: 2.0
dt0: 0.01

loss:
  _target_: src.losses.MSELoss
  snr_weighting: false

optimizer:
  _target_: optax.adam

scheduler:
  _target_: optax.cosine_decay_schedule
  init_value: 5e-3
  decay_steps: 5000   # inner_steps(10) * num_epochs(500)
  alpha: 0.01
