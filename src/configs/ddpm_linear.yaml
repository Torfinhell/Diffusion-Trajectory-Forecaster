defaults:
  - model: diffusion_linear
  - dataloaders: basic
  - dataset: default
  - logger: clearml
  - metrics: all_metrics #TODO Did we fix all metrics?
  - visual: default #TODO Why default here?
  - diffusion_sampler: ddpm
  - _self_
trainer:
  train_mode: null
  num_epochs: 20
  train_epoch_len: 1.0
  val_epoch_len: 1.0
  log_validation: true
  grad_clip: 5.0
  seed: 1
  check_val_every_n_epoch: 1
  print_hparams: False
  logging: "offline"

dataset:
  data:
    s3_url: null
    data_access: null

loss:
  _target_: src.losses.MseXYLoss
  coord_scale: 1.0

optimizer:
  _target_: optax.adam

scheduler:
  _target_: optax.cosine_decay_schedule
  init_value: 1e-3
  decay_steps: 230
  alpha: 0.7
