defaults:
  - model: diffusion_linear
  - dataloaders: basic
  - feat_extract: small_no_scenes
  - logger: clearml
  - metrics: all_metrics #TODO Did we fix all metrics?
  - visual: default #TODO Why default here?
  - diffusion_sampler: ddpm
  - _self_
trainer:
  train_mode: null
  path_type: "xy" # or "ay" -accelarate yaw rate
  num_epochs: 20
  train_epoch_len: 1.0
  val_epoch_len: 1.0
  log_validation: true
  gradient_clip_val: 5.0
  seed: 1
  check_val_every_n_epoch: 1
  print_hparams: False
  logging: "offline"
loss:
  _target_: src.losses.MSELoss
  coord_scale: 1.0
  path_type: ${trainer.path_type}

optimizer:
  _target_: optax.adam

scheduler:
  _target_: optax.cosine_decay_schedule
  init_value: 1e-3
  decay_steps: 230
  alpha: 0.7
