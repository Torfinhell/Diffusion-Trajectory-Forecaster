defaults:
  - model: diffusion_attn
  - dataloaders: overfit
  - dataset: small_no_scenes
  - logger: clearml
  - metrics: all_metrics
  - visual: default
  - diffusion_sampler: ddpm
  - _self_

trainer:
  train_mode: "train"
  num_epochs: 10
  train_epoch_len: 1.0
  val_epoch_len: 1.0
  log_validation: true
  gradient_clip_val: 5
  seed: 1
  train_metric_every_n_epochs: 5
  val_metric_every_n_epochs: 5
  check_val_every_n_epoch: 1
  print_hparams: False
  logging: "online"

  best_checkpoint_metric: "val/loss"
  best_checkpoint_mode: "min"
  load_best_checkpoint: false

  run_test_after_fit: false
  test_with_best_checkpoint: true

dataset:
  data:
    s3_url: null
    data_access: null

loss:
  _target_: src.losses.MseXYLoss
  coord_scale: 1.0

optimizer:
  _target_: optax.adam

scheduler:
  _target_: optax.cosine_decay_schedule
  init_value: 5e-3
  decay_steps: 650
  alpha: 0.01
