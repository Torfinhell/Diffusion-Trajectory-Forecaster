defaults:
  - model: diffusion_attn
  - dataloaders: overfit
  - feat_extract: small_no_scenes
  - logger: clearml
  - metrics: all_metrics
  - visual: default
  - diffusion_sampler: ddpm
  - _self_

trainer:
  train_mode: "train"
  path_type: "xy"
  num_epochs: 1000
  train_epoch_len: 1.0
  val_epoch_len: 1.0
  log_validation: true
  gradient_clip_val: 5
  seed: 1
  check_val_every_n_epoch: 20
  print_hparams: False
  logging: "online"

loss:
  _target_: src.losses.MSELoss
  coord_scale: 1.0
  path_type: ${trainer.path_type}

optimizer:
  _target_: optax.adam

scheduler:
  _target_: optax.cosine_decay_schedule
  init_value: 5e-3
  decay_steps: 650
  alpha: 0.01
