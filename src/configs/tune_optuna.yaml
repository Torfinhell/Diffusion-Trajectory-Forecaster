base_config_name: ddpm_attn

study:
  name: diffusion-attn-ade
  storage: null
  direction: minimize
  load_if_exists: true
  n_trials: 15
  timeout: null

objective:
  metric: train/ADE

trainer:
  num_epochs: 25
  train_epoch_len: 1.0
  val_epoch_len: 1.0
  val_metric_every_n_epochs: 100
  train_metric_every_n_epochs: 1

runtime:
  accelerator: gpu
  show_progress: false

search:
  widths: [12, 16, 20, 24, 32]
  scene_mlp_ratios: [1.0, 1.5, 2.0]
  attn_mlp_ratios: [1.0, 1.5, 2.0]
  mlp_multiple: 2
  num_sa_mlp:
    min: 1
    max: 3
  num_camlp:
    min: 1
    max: 4
  batch_sizes: [2, 5, 10]
  lr0:
    min: 1e-4
    max: 4e-3
  lrf:
    min: 0.003
    max: 0.8
